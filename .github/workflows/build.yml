name: Build

# Compiles TartarusEngine on Windows (the only platform it targets — MSVC via the
# Visual Studio generator) on every push and
# pull request, for both Debug and Release. This is intentionally a COMPILE gate first and
# foremost: it exists to catch the class of bug a human never gets to see locally until they
# pull a branch and build it themselves.
#
# EVERY step here gates. That was not always true, and the ways it was not are worth knowing:
#
#  - The unit-test step ran the engine bare. In Release WIN32_EXECUTABLE makes it a
#    GUI-subsystem binary, which PowerShell does not wait for, so the step passed while tests
#    failed (#351). Native tools are invoked through Start-Process -PassThru and waited for
#    explicitly for that reason - do the same for anything added here that is meant to gate.
#  - The crash-dump assertion ran against a smoke process that had not finished, for the same
#    reason (#354).
#  - The --smoke-test step was continue-on-error because hosted runners have no GPU and this
#    engine needs a real OpenGL 4.6 core context with compute shaders. It now gets one from Mesa
#    llvmpipe (fetched and checksum-verified below), renders every smoke scene in about 3 minutes,
#    and gates (#357).
#  - The crash-dump assertion globbed build/<config>/, where dumps stopped being written when
#    #148 moved them to %LOCALAPPDATA%\TartarusEngine\Crashes\. The check was right when it was
#    written and went quiet eight days later without failing (#358). A check that can only ever
#    pass looks exactly like a check that keeps passing - if you move where an artifact lands,
#    grep this file for the old path.
#
# The work is split so the slow parts run side by side instead of in one 60-minute job:
#   debug  - static checks + Debug build + unit tests
#   build  - Release build + unit tests + package (uploaded) + the Release runtime for the test jobs
#   smoke  - needs build: --smoke-test under Mesa llvmpipe, no rebuild
#   editor - needs build: --editor-tests in two shards (TARTARUS_EDITOR_TEST_SHARD), only when the change touches the editor
#   gate   - the one job to require in branch protection: green only if all of the above passed (editor may be skipped)
# The test jobs run the exe that `build` produced, so the Release rebuild happens once. They check out the repo
# as well: the engine finds project/ by walking up from build\Release\, which lands on the checkout.
#
# So a red build here means something real: it failed to compile, a unit test failed, a scene
# failed to render, or the engine left a crash dump.

on:
  # Branches are built through their PR (pull_request = the branch merged into main); a push build on top
  # of that only ran the same jobs twice. Pushes still build main and release tags.
  push:
    branches: [main]
    # Tags are a separate filter, not covered by branches: without this a `v*` tag push runs
    # nothing and the release job below could never fire (#173 suggestion 4).
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new commit on a PR cancels that PR's run still in progress (it tests a commit nobody will merge).
# Pushes to main and tags never cancel each other: every main commit and release keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }} # per commit outside PRs: a shared group would drop queued runs
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static checks, then the Debug build + unit tests. Debug only compiles and runs the headless tests: its render
  # gates gave the same results as Release at twice the time, so no Mesa here.
  debug:
    runs-on: windows-latest
    # Backstop: a hung build must not sit on a runner until GitHub's 6-hour job ceiling.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Third-party asset policy
        run: python tools/assets/check_git_assets.py

      - name: Asset export regression
        run: python -m unittest discover -s tools/assets -p 'test_*.py'

      # Structural guard for #302 / #184: every ECS component must be registered with
      # ComponentRegistry (auto-generates its serialization + Inspector + Add Component) or
      # explicitly allow-listed with a reason. Pure static check, no build needed - run it
      # first so "added a component, forgot to wire it up" fails in seconds. Only meaningful on
      # one config; the Debug job is enough.
      - name: Component registration check
        run: python tools/check_component_registration.py

      # Structural guard for #160 / Phase 1 item 7: "two - and only two - button treatments"
      # across the editor. Same pure-static, no-build-needed treatment as the component check above.
      - name: Button styling check
        run: python tools/check_button_styling.py

      # CMake's FetchContent re-clones + rebuilds glfw/glm/assimp/entt/imgui/imguizmo from
      # source every configure otherwise (assimp alone is the bulk of the build time). Keyed on
      # cmake/Dependencies.cmake, where every FetchContent pin lives, so a dependency version bump
      # invalidates the cache and an edit to the engine's own CMakeLists.txt does not.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-Debug-${{ hashFiles('cmake/Dependencies.cmake') }}

      # PhysX is an ExternalProject, not FetchContent, so it lands in build/physx_external-prefix
      # and the cache above never covered it: 1.1 GB of clone plus build, recompiled on every job
      # of every run, and most of the Build step's ~9m24s (#361).
      #
      # Measured by deleting a local build tree down to just these two caches and rebuilding:
      # configure + build finished in 85 seconds with zero PhysX source files recompiled. The
      # ExternalProject steps still run, they just find everything up to date ("Already at
      # requested tag", "no change (already patched)", "Configuring done (0.1s)").
      #
      # The WHOLE prefix is cached. Dropping build-out/ and src/physx_external-build/ (640 MB
      # between them) and keeping only the harvested stage/ looks tempting and does not work:
      # MSBuild needs those intermediates to conclude the build is up to date, and without them
      # PhysX recompiles in full. src/physx_external/.git is required too - the git update step
      # has no stamp file, so it runs on every build and fails outright without the repo.
      #
      # Keyed on cmake/PhysX.cmake plus the two PhysX helper scripts: every ExternalProject flag
      # lives in that file, so a changed flag still invalidates the cache (/fp:fast vs
      # /fp:precise was a real bug once, a thrown ball freezing mid-air, #312), while unrelated
      # CMakeLists.txt edits no longer rebuild PhysX.
      #
      # No config in the key on purpose: PhysX builds debug AND release in one
      # ExternalProject invocation, so the debug and build jobs share one entry. On a cold key they both miss,
      # both build it, and both try to save - the loser logs "Cache already exists" and carries
      # on. That is expected, not a failure.
      - name: Cache the PhysX build
        uses: actions/cache@v4
        with:
          path: build/physx_external-prefix
          key: physx-${{ hashFiles('cmake/PhysX.cmake', 'tools/physx_patch.cmake', 'tools/physx_harvest.cmake') }}

      # No -G here on purpose: hardcoding "Visual Studio 17 2022" broke the first run of this
      # workflow the moment the hosted windows-latest image moved to VS2026 (the generator name
      # is tied to a specific VS version and doesn't auto-upgrade). Omitting -G lets CMake pick
      # whatever Visual Studio is actually installed on the runner; -A x64 still pins the
      # architecture regardless of which VS version that resolves to.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Debug --parallel

      # #173 - headless unit tests (undo deltas, GUIDs, atomic writes, texture-cache keys,
      # material JSON robustness, component registry). They run before any window / GL context
      # exists, so unlike the smoke test they work on this GPU-less runner and DO gate the
      # job: the exit code is the number of failed checks.
      # The exit code is the number of failed checks, and it has to be waited for and asserted
      # explicitly. Release/RelWithDebInfo set WIN32_EXECUTABLE, so the engine is a GUI-subsystem
      # binary in those configs: PowerShell launches it and returns IMMEDIATELY without waiting,
      # leaving $LASTEXITCODE unset. That is why this gate was blind in Release - the exe printed
      # "1 failure(s)" and exited 1 while the step had already moved on and reported success.
      # (Debug is a console subsystem app, so it gated correctly all along.)
      #
      # Start-Process -PassThru + WaitForExit waits for either subsystem and hands back the real
      # exit code; -NoNewWindow keeps the test output in this log. Reading Handle first keeps
      # ExitCode available once the process is gone.
      - name: Unit tests
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = "build\Debug\TartarusEngine.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--unit-tests" -NoNewWindow -PassThru
          $null = $p.Handle; $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "unit tests reported $($p.ExitCode) failed check(s)" }

  # The Release build, once. Everything the test jobs need leaves here as an artifact; the package leaves as a
  # release candidate. Also decides whether the editor tests run (the `scope` step).
  build:
    # Only the release step needs more than read, and only on a tag. Declaring it here rather
    # than leaving the workflow on the repository default keeps the token narrow.
    permissions:
      contents: write
    runs-on: windows-latest
    # Backstop: a hung build must not sit on a runner until GitHub's 6-hour job ceiling.
    # Build ~15 + unit tests 5 + package/verify; the render and editor tests are other jobs now.
    timeout-minutes: 40
    outputs:
      editor: ${{ steps.scope.outputs.editor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the PR's test merge commit plus its first parent (main), for the change list below

      # The editor tests (~17 min of work, split in two shards) only re-prove the editor when something
      # editor-facing changed. A PR runs them when it touches one of these paths; pushes to main, tags and manual runs always do.
      - name: Does this change touch the editor?
        id: scope
        shell: pwsh
        run: |
          $editor = $true
          if ("${{ github.event_name }}" -eq "pull_request") {
            $changed = @(git diff --name-only HEAD^1 HEAD)
            $paths = '^(src/(Editor|Core|App|Assets|Graffiti)/|src/main\.cpp$|src/Tests/(EditorSmoke/|EditorUiTests)|assets/|project/assets/Decals/|CMakeLists\.txt$|cmake/|\.github/workflows/|\.github/actions/)'
            $hits = @($changed | Where-Object { $_ -match $paths })
            $editor = $hits.Count -gt 0
            Write-Host "$($changed.Count) changed file(s), $($hits.Count) editor-facing"
            $hits | Select-Object -First 20 | ForEach-Object { Write-Host "  $_" }
          }
          Write-Host "editor tests: $editor"
          "editor=$($editor.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      # Same caches as the debug job (see the notes there): FetchContent per config, PhysX shared.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-Release-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Cache the PhysX build
        uses: actions/cache@v4
        with:
          path: build/physx_external-prefix
          key: physx-${{ hashFiles('cmake/PhysX.cmake', 'tools/physx_patch.cmake', 'tools/physx_harvest.cmake') }}

      # No -G, for the reason given in the debug job.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      # Waited for explicitly, for the reason given in the debug job (Release is a GUI-subsystem binary, #351).
      - name: Unit tests
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = "build\Release\TartarusEngine.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--unit-tests" -NoNewWindow -PassThru
          $null = $p.Handle; $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "unit tests reported $($p.ExitCode) failed check(s)" }

      # What the smoke and editor jobs run: the exe, the engine's DLLs (TartarusEditor/TartarusGame, PhysX) and
      # the assets staged next to the exe by the POST_BUILD steps. NOT the pdb/lib/exp files (build-time only).
      # project/ comes from the test jobs' own checkout (ProjectPaths walks up from the exe to find it). The
      # hot-reload test's real module rebuild needs the CMake build tree, which is not shipped: GameModuleBuild::Available()
      # is false in the test jobs and that test skips its rebuild (it ran in the old single job).
      - name: Upload the Release runtime for the test jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-runtime
          path: |
            build/Release/*.exe
            build/Release/*.dll
            build/Release/assets/
          if-no-files-found: error
          retention-days: 1

      # --- Packaging (#173 suggestion 4) ---------------------------------------------------
      # Release only: a Debug ZIP would ship the debug CRT, which end users do not have.
      - name: Package (CPack ZIP)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cpack --config build/CPackConfig.cmake -C Release
          Get-ChildItem build/package -Filter *.zip | ForEach-Object {
            Write-Host "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB"
          }

      # Producing a ZIP proves nothing about whether it works. This extracts it somewhere with no
      # relation to the build tree and runs the engine out of it, so a missing DLL or a
      # forgotten install() rule fails HERE rather than in a user's download.
      #
      # The assets diff is the part that earns its keep: every POST_BUILD step stages content next
      # to the exe, and each one needs a matching install() rule. Comparing the two trees means
      # adding a staged asset without packaging it cannot pass, which a fixed manifest list would
      # not catch.
      - name: Verify the package runs standalone
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = (Get-ChildItem build/package -Filter *.zip | Select-Object -First 1)
          if (-not $zip) { throw "cpack produced no ZIP" }
          $dest = "$env:RUNNER_TEMP\pkgcheck"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $dest
          # Archive generators wrap the payload in a top-level folder by default
          # (CPACK_INCLUDE_TOPLEVEL_DIRECTORY); don't assume it either way.
          $root = if (Test-Path (Join-Path $dest "TartarusEngine.exe")) { $dest }
                  else { (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName }
          if (-not $root) { throw "nothing usable in the extracted archive" }
          Write-Host "extracted to $root"

          $required = @(
            "TartarusEngine.exe", "TartarusEditor.dll", "TartarusGame.dll",
            "PhysX.dll", "PhysXCommon.dll", "PhysXFoundation.dll", "PhysXCooking.dll",
            "LICENSE", "THIRD-PARTY-NOTICES.md", "README-FIRST-RUN.txt",
            "assets\shaders\ModelFragment.glsl", "assets\fonts\fa-solid-900.ttf",
            "project\scenes\Apartment Hallway.json"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $root $_)) }
          if ($missing) { throw "package is missing: $($missing -join ', ')" }

          # Mixamo's licence does not allow redistributing the character FBX files, and the sky
          # HDRIs are too large to ship. Neither exists on a runner, so this asserts the install
          # rules stay an allow-list - on a developer machine, where both DO exist, an
          # exclude-list edited wrongly would quietly put them in the ZIP.
          foreach ($banned in @("project\assets\characters", "project\assets\sky")) {
            if (Test-Path (Join-Path $root $banned)) { throw "package must not contain $banned" }
          }

          # Exactly these top-level entries, nothing else. A FetchContent dependency with its own
          # install() rules lands here uninvited - EnTT put include/entt and lib/EnTT in the first
          # ZIP built from this config, and it is header-only. This is the durable guard: whoever
          # adds the next dependency finds out from a red build rather than from a user.
          $expected = @(
            "assets", "project", "LICENSE", "README-FIRST-RUN.txt", "THIRD-PARTY-NOTICES.md",
            "TartarusEngine.exe", "TartarusEditor.dll", "TartarusGame.dll",
            "PhysX.dll", "PhysXCommon.dll", "PhysXCooking.dll", "PhysXFoundation.dll"
          )
          $actual = Get-ChildItem $root | ForEach-Object { $_.Name }
          $extra = $actual | Where-Object { $expected -notcontains $_ }
          if ($extra) {
            throw "unexpected top-level entries in the package: $($extra -join ', ') - a dependency is probably installing itself; see the EnTT note in cmake/Dependencies.cmake"
          }

          # Every file staged next to the exe by a POST_BUILD step must also be in the package.
          $staged   = Get-ChildItem "build\Release\assets" -Recurse -File |
                      ForEach-Object { $_.FullName.Substring((Resolve-Path "build\Release\assets").Path.Length + 1) }
          $packaged = Get-ChildItem (Join-Path $root "assets") -Recurse -File |
                      ForEach-Object { $_.FullName.Substring((Join-Path $root "assets").Length + 1) }
          $notPackaged = $staged | Where-Object { $packaged -notcontains $_ }
          if ($notPackaged) {
            throw "staged next to the exe but not in the package (add it to TARTARUS_STAGED_ASSETS in CMakeLists.txt): $($notPackaged -join ', ')"
          }
          Write-Host "$($staged.Count) staged asset files, all present in the package"

          # Run the engine from the extracted folder. Unit tests need no GL context, so this is a
          # real check that the binary starts and finds its DLLs with nothing from the build tree
          # on the path. Waited for explicitly - GUI-subsystem binary, see #351.
          $exe = Join-Path $root "TartarusEngine.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--unit-tests" -WorkingDirectory $root -NoNewWindow -PassThru
          $null = $p.Handle; $p.WaitForExit()   # not -Wait: see the Unit tests step
          if ($p.ExitCode -ne 0) { throw "the packaged engine reported $($p.ExitCode) failed check(s)" }
          Write-Host "the packaged engine runs standalone"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: TartarusEngine-win64
          path: build/package/*.zip
          retention-days: 30

      # Tag a commit v0.1.0 (matching the version in CMakeLists.txt) and push it to publish.
      # Uses the gh CLI rather than a third-party release action: one less thing to pin, review
      # and trust with a write token.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $zip = (Get-ChildItem build/package -Filter *.zip | Select-Object -First 1).FullName
          gh release create "${{ github.ref_name }}" $zip `
            --repo "${{ github.repository }}" `
            --title "Tartarus Engine ${{ github.ref_name }}" `
            --generate-notes

  # The software-rendered smoke scenes. Runs the exe `build` produced under Mesa llvmpipe.
  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # project/ (scenes, settings) and the Mesa composite action

      - uses: actions/download-artifact@v4
        with:
          name: release-runtime
          path: build/Release

      - name: Fetch Mesa llvmpipe (software OpenGL 4.6)
        uses: ./.github/actions/mesa
        with:
          destination: build\Release

      # The crash handler writes dumps to %LOCALAPPDATA%\TartarusEngine\Crashes\, which persists
      # for the life of the runner. Clearing it first means the assertion after the smoke test can
      # only ever fire on a dump THIS job produced - nothing carried in from an earlier step.
      - name: Clear crash dumps before the smoke run
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\TartarusEngine\Crashes"
          if (Test-Path $dir) { Remove-Item "$dir\*" -Force -Recurse -ErrorAction SilentlyContinue }
          Write-Host "cleared $dir"

      # A REAL GATE. It was continue-on-error for as long as the runners had no OpenGL 4.6 at
      # all; with llvmpipe supplying one, every smoke scene passes here (verified: about 3 minutes),
      # so a rendering regression must now fail the build rather than being
      # swallowed. Software rasterisation is slow, hence the much larger timeout - it is roughly
      # 3 minutes today, and the headroom is for scenes added later, not for a hang.
      #
      # The timeout is load-bearing rather than tidiness: a build that cannot create its
      # window can STALL instead of exiting. Without a cap the job would ride GitHub's
      # 6-hour ceiling. Start-Process -Wait -PassThru for the usual reason - in Release the engine
      # is a GUI-subsystem binary and a bare invocation returns immediately (#351, #354).
      - name: Smoke test (Mesa llvmpipe)
        timeout-minutes: 15
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
        run: |
          $exe = "build\Release\TartarusEngine.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -NoNewWindow -Wait -PassThru
          Write-Host "smoke test exited with $($p.ExitCode)"
          exit $p.ExitCode

      # The smoke step above gates on its own exit code, but a process can render every smoke scene,
      # report success and THEN fault on the way out. CrashHandler catches that and writes a
      # minidump, so a dump existing is a failure even when the exit code was 0. That teardown
      # crash class (e.g. #389 - the registry destroyed after the hot-reload DLLs it bound into
      # were unloaded) is deterministic C++, not GPU-dependent, which is why it gets its own step.
      #
      # LOOK IN THE RIGHT PLACE. This step used to glob build/<config>/, which was correct when it
      # was written (0e2d843, Sept 10) and stopped being correct eight days later when #148 moved
      # dumps to %LOCALAPPDATA%\TartarusEngine\Crashes\ (8f95561, Sept 18). Nothing failed; the
      # glob just matched nothing, every run, for as long as it took to notice (#358). The exe
      # directory is still checked because ResolveDumpDir() falls back to it when LOCALAPPDATA is
      # unset - both paths, so neither can go quiet again.
      #
      # Only .dmp: the handler writes a minidump and a line to stderr, never a .txt. The old
      # version cat'd crash_*.txt, which never existed either.
      - name: Assert smoke test left no crash dump
        if: always()
        shell: pwsh
        run: |
          $dirs = @("$env:LOCALAPPDATA\TartarusEngine\Crashes", "build\Release")
          $dumps = @($dirs | Where-Object { Test-Path $_ } |
                     ForEach-Object { Get-ChildItem $_ -Filter "crash_*.dmp" -ErrorAction SilentlyContinue })
          if ($dumps.Count -gt 0) {
            foreach ($d in $dumps) { Write-Host "  $($d.FullName)  ($($d.Length) bytes)" }
            Write-Host "::error::smoke test left $($dumps.Count) crash dump(s) - see the crash-dumps artifact"
            New-Item -ItemType Directory -Force -Path crash-dumps | Out-Null
            $dumps | ForEach-Object { Copy-Item $_.FullName crash-dumps -Force }
            exit 1
          }
          Write-Host "no crash dump - ok"

      # A red build that throws the evidence away is half a gate. Only runs when the step above
      # found something, so a green build uploads nothing.
      - name: Upload crash dumps
        if: failure() && hashFiles('crash-dumps/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-smoke
          path: crash-dumps/
          retention-days: 14

  # The editor smoke test (--editor-tests, src/Tests/EditorUiTests.cpp + EditorSmoke_*.cpp): drives every panel,
  # menu and tool of the real editor with synthetic input, under the same llvmpipe context as the smoke test.
  # Split into two shards (TARTARUS_EDITOR_TEST_SHARD=i/2: the k-th test runs in shard k % 2) that run in parallel.
  # Exit code is 0 only when every test of the shard passed. Runs only when the change touches the editor.
  editor:
    needs: build
    if: needs.build.outputs.editor == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4 # project/ (the scenes and assets the tests open) and the Mesa composite action

      - uses: actions/download-artifact@v4
        with:
          name: release-runtime
          path: build/Release

      - name: Fetch Mesa llvmpipe (software OpenGL 4.6)
        uses: ./.github/actions/mesa
        with:
          destination: build\Release

      - name: Clear crash dumps before the editor run
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\TartarusEngine\Crashes"
          if (Test-Path $dir) { Remove-Item "$dir\*" -Force -Recurse -ErrorAction SilentlyContinue }
          Write-Host "cleared $dir"

      # It writes its screenshots to editor-test-shots/, uploaded below whether it passed or not.
      # The Scenes suite is skipped because CI has none of the external assets its scenes load (each would wait for nothing).
      - name: Editor smoke test (Mesa llvmpipe, shard ${{ matrix.shard }}/2)
        timeout-minutes: 22
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          TARTARUS_EDITOR_TEST_SHOTS: ${{ github.workspace }}\editor-test-shots
          TARTARUS_EDITOR_TEST_SHOW: "1"
          TARTARUS_EDITOR_TEST_EXCLUDE: "scenes:"
          TARTARUS_EDITOR_TEST_SHARD: "${{ matrix.shard }}/2"
          # The run's own watchdog aborts (with a crash dump, uploaded below) before this step's
          # timeout, so a hang still leaves the log naming the test and step it stopped in.
          TARTARUS_EDITOR_TEST_DEADLINE: "18"
          # The hot-reload test's real module rebuild runs MSBuild, whose worker nodes otherwise
          # stay alive ~15 minutes after the build.
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          $exe = "build\Release\TartarusEngine.exe"
          # WaitForExit, not -Wait: Start-Process -Wait also waits for every process the editor
          # started. After a module rebuild that was MSBuild's idle nodes, and the step outlived the
          # editor by up to 15 minutes or ran into its timeout.
          $p = Start-Process -FilePath $exe -ArgumentList "--editor-tests" -NoNewWindow -PassThru
          $null = $p.Handle; $p.WaitForExit()
          Write-Host "editor tests exited with $($p.ExitCode)"
          Get-CimInstance Win32_Process -Filter "ParentProcessId = $($p.Id)" | ForEach-Object {
            Write-Host "still running from the editor: $($_.Name) (pid $($_.ProcessId))"
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }
          exit $p.ExitCode

      - name: Upload editor screenshots
        if: always() && hashFiles('editor-test-shots/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: editor-test-shots-Release-${{ matrix.shard }}
          path: editor-test-shots/
          retention-days: 14

      # Same crash-dump assertion as the smoke job (see the notes there: both dump locations, .dmp only).
      - name: Assert editor tests left no crash dump
        if: always()
        shell: pwsh
        run: |
          $dirs = @("$env:LOCALAPPDATA\TartarusEngine\Crashes", "build\Release")
          $dumps = @($dirs | Where-Object { Test-Path $_ } |
                     ForEach-Object { Get-ChildItem $_ -Filter "crash_*.dmp" -ErrorAction SilentlyContinue })
          if ($dumps.Count -gt 0) {
            foreach ($d in $dumps) { Write-Host "  $($d.FullName)  ($($d.Length) bytes)" }
            Write-Host "::error::editor tests left $($dumps.Count) crash dump(s) - see the crash-dumps artifact"
            New-Item -ItemType Directory -Force -Path crash-dumps | Out-Null
            $dumps | ForEach-Object { Copy-Item $_.FullName crash-dumps -Force }
            exit 1
          }
          Write-Host "no crash dump - ok"

      - name: Upload crash dumps
        if: failure() && hashFiles('crash-dumps/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-editor-${{ matrix.shard }}
          path: crash-dumps/
          retention-days: 14

  # The single required check. A skipped or cancelled job would otherwise look "not failed", so this spells out
  # what green means: debug, build and smoke succeeded, and editor succeeded or was skipped (a change that touches
  # nothing editor-facing).
  gate:
    needs: [debug, build, smoke, editor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        shell: bash
        env:
          DEBUG: ${{ needs.debug.result }}
          BUILD: ${{ needs.build.result }}
          SMOKE: ${{ needs.smoke.result }}
          EDITOR: ${{ needs.editor.result }}
        run: |
          echo "debug:  $DEBUG"
          echo "build:  $BUILD"
          echo "smoke:  $SMOKE"
          echo "editor: $EDITOR (skipped is fine: nothing editor-facing changed)"
          ok=1
          for r in "$DEBUG" "$BUILD" "$SMOKE"; do [ "$r" = "success" ] || ok=0; done
          case "$EDITOR" in success|skipped) ;; *) ok=0 ;; esac
          if [ "$ok" != 1 ]; then echo "::error::a required job did not pass"; exit 1; fi
          echo "all green"
