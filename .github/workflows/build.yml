name: Build

# Compiles TartarusEngine on Windows (the only platform it targets — MSVC via the
# Visual Studio generator) on every push and
# pull request, for both Debug and Release. This is intentionally a COMPILE gate first and
# foremost: it exists to catch the class of bug a human never gets to see locally until they
# pull a branch and build it themselves.
#
# EVERY step here gates. That was not always true, and the ways it was not are worth knowing:
#
#  - The unit-test step ran the engine bare. In Release WIN32_EXECUTABLE makes it a
#    GUI-subsystem binary, which PowerShell does not wait for, so the step passed while tests
#    failed (#351). Native tools are invoked through Start-Process -Wait -PassThru for that
#    reason - do the same for anything added here that is meant to gate.
#  - The crash-dump assertion ran against a smoke process that had not finished, for the same
#    reason (#354).
#  - The --smoke-test step was continue-on-error because hosted runners have no GPU and this
#    engine needs a real OpenGL 4.6 core context with compute shaders. It now gets one from Mesa
#    llvmpipe (fetched and checksum-verified below), renders all 16 scenes in about 3 minutes,
#    and gates (#357).
#  - The crash-dump assertion globbed build/<config>/, where dumps stopped being written when
#    #148 moved them to %LOCALAPPDATA%\TartarusEngine\Crashes\. The check was right when it was
#    written and went quiet eight days later without failing (#358). A check that can only ever
#    pass looks exactly like a check that keeps passing - if you move where an artifact lands,
#    grep this file for the old path.
#
# So a red build here means something real: it failed to compile, a unit test failed, a scene
# failed to render, or the engine left a crash dump.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Backstop: a hung build or smoke test must not sit on a runner until GitHub's 6-hour
    # job ceiling. The compile + cached deps finish well inside this; anything approaching it
    # is a hang worth failing fast on.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      # Structural guard for #302 / #184: every ECS component must be registered with
      # ComponentRegistry (auto-generates its serialization + Inspector + Add Component) or
      # explicitly allow-listed with a reason. Pure static check, no build needed — run it
      # first so "added a component, forgot to wire it up" fails in seconds. Only meaningful on
      # one config; the Debug job is enough.
      - name: Component registration check
        if: matrix.config == 'Debug'
        run: python tools/check_component_registration.py

      # Structural guard for #160 / Phase 1 item 7: "two — and only two — button treatments"
      # across the editor. Same pure-static, no-build-needed, Debug-only treatment as the
      # component check above.
      - name: Button styling check
        if: matrix.config == 'Debug'
        run: python tools/check_button_styling.py

      # CMake's FetchContent re-clones + rebuilds glfw/glm/assimp/entt/imgui/imguizmo from
      # source every configure otherwise (assimp alone is the bulk of the build time). Keyed on
      # CMakeLists.txt so a dependency version bump invalidates the cache automatically.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ matrix.config }}-${{ hashFiles('CMakeLists.txt') }}

      # No -G here on purpose: hardcoding "Visual Studio 17 2022" broke the first run of this
      # workflow the moment the hosted windows-latest image moved to VS2026 (the generator name
      # is tied to a specific VS version and doesn't auto-upgrade). Omitting -G lets CMake pick
      # whatever Visual Studio is actually installed on the runner; -A x64 still pins the
      # architecture regardless of which VS version that resolves to.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      # #173 - headless unit tests (undo deltas, GUIDs, atomic writes, texture-cache keys,
      # material JSON robustness, component registry). They run before any window / GL context
      # exists, so unlike the smoke test below they work on this GPU-less runner and DO gate the
      # job: the exit code is the number of failed checks.
      # The exit code is the number of failed checks, and it has to be waited for and asserted
      # explicitly. Release/RelWithDebInfo set WIN32_EXECUTABLE, so the engine is a GUI-subsystem
      # binary in those configs: PowerShell launches it and returns IMMEDIATELY without waiting,
      # leaving $LASTEXITCODE unset. That is why this gate was blind in Release - the exe printed
      # "1 failure(s)" and exited 1 while the step had already moved on and reported success.
      # (Debug is a console subsystem app, so it gated correctly all along.)
      #
      # Start-Process -Wait -PassThru waits for either subsystem and hands back the real exit
      # code; -NoNewWindow keeps the test output in this log.
      - name: Unit tests
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = "build\${{ matrix.config }}\TartarusEngine.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--unit-tests" -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "unit tests reported $($p.ExitCode) failed check(s)" }

      # #173 suggestion 2 - a software OpenGL 4.6 driver, so the smoke test can actually run on a
      # GPU-less runner. The engine requires a 4.6 CORE context and fails fast below it
      # (Window.cpp), and it uses compute shaders, so the basic-display-adapter fallback cannot
      # serve it; Mesa llvmpipe can.
      #
      # There is no official Mesa binary for Windows, so this pulls a community build. It is
      # pinned two ways and BOTH are load-bearing: an exact release tag, and the SHA-256 that
      # GitHub publishes for that asset, verified before anything is extracted or executed. A
      # changed or substituted archive fails the step instead of running.
      - name: Fetch Mesa llvmpipe (software OpenGL 4.6)
        id: mesa
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver  = "26.1.8"
          $name = "mesa3d-$ver-release-msvc.7z"
          $sha  = "4C6D32E653E0FF9AD07796E40C0BCFABF2764D849E3CE4F3B1590112C87E42F9"
          $url  = "https://github.com/pal1000/mesa-dist-win/releases/download/$ver/$name"
          Invoke-WebRequest -Uri $url -OutFile $name
          $got = (Get-FileHash -Algorithm SHA256 -Path $name).Hash
          if ($got -ne $sha) { throw "Mesa archive SHA-256 mismatch: expected $sha, got $got" }
          Write-Host "Mesa $ver checksum verified"
          7z x $name -omesa -y | Out-Null
          # Layout differs between Mesa builds, so find the 64-bit opengl32.dll rather than
          # assuming a path.
          $gl = Get-ChildItem -Path mesa -Recurse -Filter opengl32.dll |
                Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $gl) { throw "no x64 opengl32.dll in the Mesa archive" }
          Write-Host "using $($gl.FullName)"
          Copy-Item -Path (Join-Path $gl.Directory.FullName "*.dll") -Destination "build\${{ matrix.config }}" -Force

      # The crash handler writes dumps to %LOCALAPPDATA%\TartarusEngine\Crashes\, which persists
      # for the life of the runner. Clearing it first means the assertion after the smoke test can
      # only ever fire on a dump THIS job produced - nothing carried in from an earlier step.
      - name: Clear crash dumps before the smoke run
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\TartarusEngine\Crashes"
          if (Test-Path $dir) { Remove-Item "$dir\*" -Force -Recurse -ErrorAction SilentlyContinue }
          Write-Host "cleared $dir"

      # A REAL GATE. It was continue-on-error for as long as the runners had no OpenGL 4.6 at
      # all; with llvmpipe supplying one, all 16 scenes pass here (verified: both configs, exit 0,
      # about 3 minutes each), so a rendering regression must now fail the build rather than being
      # swallowed. Software rasterisation is slow, hence the much larger timeout - it is roughly
      # 3 minutes today, and the headroom is for scenes added later, not for a hang.
      #
      # The timeout is load-bearing rather than tidiness: a Debug build that cannot create its
      # window STALLS instead of exiting (the debug CRT's abort path waits on a message box that
      # a non-interactive desktop never dismisses). Without a cap the job would ride GitHub's
      # 6-hour ceiling. Start-Process -Wait -PassThru for the usual reason - in Release the engine
      # is a GUI-subsystem binary and a bare invocation returns immediately (#351, #354).
      - name: Smoke test (Mesa llvmpipe)
        timeout-minutes: 25
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
        run: |
          $exe = "build\${{ matrix.config }}\TartarusEngine.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -NoNewWindow -Wait -PassThru
          Write-Host "smoke test exited with $($p.ExitCode)"
          exit $p.ExitCode

      # The smoke step above gates on its own exit code, but a process can render all 16 scenes,
      # report success and THEN fault on the way out. CrashHandler catches that and writes a
      # minidump, so a dump existing is a failure even when the exit code was 0. That teardown
      # crash class (e.g. #389 — the registry destroyed after the hot-reload DLLs it bound into
      # were unloaded) is deterministic C++, not GPU-dependent, which is why it gets its own step.
      #
      # LOOK IN THE RIGHT PLACE. This step used to glob build/<config>/, which was correct when it
      # was written (0e2d843, Sept 10) and stopped being correct eight days later when #148 moved
      # dumps to %LOCALAPPDATA%\TartarusEngine\Crashes\ (8f95561, Sept 18). Nothing failed; the
      # glob just matched nothing, every run, for as long as it took to notice (#358). The exe
      # directory is still checked because ResolveDumpDir() falls back to it when LOCALAPPDATA is
      # unset — both paths, so neither can go quiet again.
      #
      # Only .dmp: the handler writes a minidump and a line to stderr, never a .txt. The old
      # version cat'd crash_*.txt, which never existed either.
      - name: Assert smoke test left no crash dump
        if: always()
        shell: pwsh
        run: |
          $dirs = @("$env:LOCALAPPDATA\TartarusEngine\Crashes", "build\${{ matrix.config }}")
          $dumps = @($dirs | Where-Object { Test-Path $_ } |
                     ForEach-Object { Get-ChildItem $_ -Filter "crash_*.dmp" -ErrorAction SilentlyContinue })
          if ($dumps.Count -gt 0) {
            foreach ($d in $dumps) { Write-Host "  $($d.FullName)  ($($d.Length) bytes)" }
            Write-Host "::error::smoke test left $($dumps.Count) crash dump(s) - see the crash-dumps artifact"
            New-Item -ItemType Directory -Force -Path crash-dumps | Out-Null
            $dumps | ForEach-Object { Copy-Item $_.FullName crash-dumps -Force }
            exit 1
          }
          Write-Host "no crash dump - ok"

      # A red build that throws the evidence away is half a gate. Only runs when the step above
      # found something, so a green build uploads nothing.
      - name: Upload crash dumps
        if: failure() && hashFiles('crash-dumps/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-${{ matrix.config }}
          path: crash-dumps/
          retention-days: 14
